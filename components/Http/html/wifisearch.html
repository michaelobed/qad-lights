<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Quick-and-Dirty Lights</title>

        <!-- Uncomment this for ESP32-side web pages... -->
        <style>[[STYLES]]</style>

        <!-- ... or uncomment this for debugging. Never, ever both! -->
        <!-- <link rel="stylesheet" href="styles.css"> -->
    </head>

    <body>
        <h1>Choose a network:</h1>
        <p>
            <form id="networkform" name="networkform" action="/wifisubmit" method="post" />
            <table>
                <tr><th></th><th></th></tr>
                <tr>
                    <td><label for="ssid" id="ssidlabel">Network:</label></td>
                    <td>
                        <select id="ssid" name="ssid" onchange="onSsid(this);" form="networkform">
                            <option value="choose">** Choose a network...**</option>
                            [[NETWORKLIST]]
                        </select>
                    </td>
                </tr>
                <tr>
                    <td><label for="psk" id="psklabel">Password:</label></td>
                    <td><input type="password" class="passwordBox" maxlength="64" id="psk" name="psk" form="networkform" /></td>
                </tr>
            </table>
        </p>
        <p>
            <input type="button" class="buttonNavigation" value="Back" onclick="goHome();" />
            <input type="submit" class="buttonNavigation" id="buttonGo" value="Go!" disabled="true" form="networkform" />
        </p>
    <script>
        function goHome() {
            location.href = "/";
        }

        function onSsid(dropdown) {
            var selected = dropdown.options[dropdown.selectedIndex];
            document.getElementById("psk").disabled = (selected.dataset.needspsk == "false");
            document.getElementById("buttonGo").disabled = (selected.value == "choose");
        }
    </script>
    </body>
</html>
